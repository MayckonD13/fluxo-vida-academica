<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!-- Zoom travado (maximum-scale=1, user-scalable=no). Para liberar o zoom de novo, use: content="width=device-width,initial-scale=1" -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Meu Painel Acadêmico</title>
<meta name="description" content="Prazos, provas, seminários e calendário acadêmico em um só lugar.">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🎓%3C/text%3E%3C/svg%3E">
<script>
try{var t=localStorage.getItem('painel-academico-v1-tema')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}
</script>
<style>
:root{
  --bg:#f5f6fb;--card:#fff;--text:#1b1f2a;--muted:#5b6475;--line:#e3e6f0;--brand:#4f46e5;--brand-ink:#fff;--danger:#dc2626;--shadow:0 1px 2px rgba(20,24,50,.06),0 4px 14px rgba(20,24,50,.05);
  --c-prova:#e11d48;--c-seminario:#7c3aed;--c-trabalho:#0891b2;--c-ic:#16a34a;--c-outro:#64748b;--c-reposicao:#d97706;
  --f-agora:#e11d48;--f-talvez:#d97706;--f-futuro:#0d9488;
  --radius:16px;
}
:root[data-theme=dark]{
  --bg:#0e1120;--card:#171b2e;--text:#eceef7;--muted:#9aa3ba;--line:#2a3050;--brand:#8b93ff;--brand-ink:#0e1120;--danger:#f87171;--shadow:0 1px 2px rgba(0,0,0,.4);
  --c-prova:#fb7185;--c-seminario:#a78bfa;--c-trabalho:#22d3ee;--c-ic:#4ade80;--c-outro:#94a3b8;--c-reposicao:#fbbf24;
  --f-agora:#fb7185;--f-talvez:#fbbf24;--f-futuro:#2dd4bf;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{touch-action:pan-x pan-y}  /* permite rolar, bloqueia pinça e toque duplo para zoom */
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:96px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0 10px}
h1{font-size:1.25rem;margin:0;letter-spacing:-.01em}
h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted);text-transform:capitalize}
h2{font-size:1.1rem;margin:22px 0 10px}
h3{font-size:1rem;margin:6px 0 2px;line-height:1.3}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;box-shadow:var(--shadow)}
.icon-btn:hover{border-color:var(--brand)}
.tools{display:flex;gap:8px}

/* navegação */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.62rem;padding:6px 0;border-radius:12px;position:relative;min-width:0}
nav.tabs a .ic{font-size:1.25rem;line-height:1}
nav.tabs a[aria-current=page]{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent);font-weight:600}
nav.tabs .long{display:none}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--danger);color:#fff;border-radius:99px;font-size:.62rem;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
@media(min-width:760px){
  nav.tabs{position:sticky;top:0;bottom:auto;display:flex;gap:6px;border:0;border-bottom:1px solid var(--line);padding:8px max(16px,calc((100% - 1068px)/2));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
  nav.tabs a{flex-direction:row;gap:8px;font-size:.92rem;padding:8px 14px}
  nav.tabs .long{display:inline}nav.tabs .short{display:none}
  .badge{position:static;margin-left:2px}
  body{padding-bottom:40px}
}

/* cartões */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--line));border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.card.done{opacity:.55}.card.done h3{text-decoration:line-through}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:.76rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:2px 9px;border-radius:99px}
.warn{font-size:.72rem;font-weight:700;color:var(--danger)}
.meta{margin:0;color:var(--muted);font-size:.88rem}
.notes{margin:6px 0 0;font-size:.86rem;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.card-bot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.count{font-size:.86rem;font-weight:600}
.count.late{color:var(--danger)}.count.soon{color:var(--f-talvez)}
.acts{display:flex;gap:4px}
.acts button{border:0;background:transparent;border-radius:10px;padding:6px 8px;font-size:1rem}
.acts button:hover{background:color-mix(in srgb,var(--text) 8%,transparent)}

/* resumo */
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:6px 0 4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
.stat.bad b{color:var(--danger)}
.stat.wide{grid-column:1/-1}.stat.wide b{font-size:1rem}
.opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:14px 0 4px;font-size:.9rem;color:var(--muted)}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.88rem}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);font-weight:600}

/* prioridades */
.cols{display:grid;gap:16px;grid-template-columns:repeat(3,1fr);align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.col{background:color-mix(in srgb,var(--f) 7%,var(--card));border:1px solid color-mix(in srgb,var(--f) 30%,var(--line));border-radius:20px;padding:12px}
.col>header{padding:4px 6px 10px}
.col h2{margin:0;font-size:1.05rem;color:var(--f)}
.col header p{margin:0;font-size:.8rem;color:var(--muted)}
.col .stack{display:grid;gap:10px}
.vazio{color:var(--muted);font-size:.9rem;padding:14px 6px;text-align:center}

/* calendário */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.cal-head h2{margin:0;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:.72rem;text-align:center;color:var(--muted);text-transform:uppercase;padding:4px 0}
.day{position:relative;min-height:58px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.day.out{opacity:.45}
.day .n{font-size:.82rem;font-weight:600}
.day.today .n{background:var(--brand);color:var(--brand-ink);border-radius:99px;min-width:22px;height:22px;display:inline-grid;place-items:center;padding:0 4px}
.day.sel{outline:2px solid var(--brand);outline-offset:-1px}
.day.rep{background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c-reposicao) 30%,transparent) 0 6px,transparent 6px 12px)}
.day.conv{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.flags{position:absolute;top:3px;right:4px;font-size:.78rem;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{display:flex;align-items:center;gap:4px;font-size:.68rem;min-width:0;max-width:100%}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chip b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.chip.done{opacity:.45}
.more{font-size:.66rem;color:var(--muted)}
@media(min-width:760px){
  .day{min-height:100px;padding:6px 7px}
  .chips{flex-direction:column;flex-wrap:nowrap;gap:2px}
  .chip{background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:6px;padding:1px 5px}
  .chip b{display:block}
}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:12px 0;font-size:.8rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}
.legend .stripe{width:18px;height:12px;border-radius:3px;border:1px solid var(--line);background-image:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c-reposicao) 45%,transparent) 0 4px,transparent 4px 8px)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-top:10px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 8px;text-transform:capitalize}
.panel .stack{display:grid;gap:10px;margin-top:10px}
.note{border-radius:12px;padding:8px 12px;font-size:.88rem;margin:6px 0}
.note.rep{background:color-mix(in srgb,var(--c-reposicao) 16%,transparent)}
.note.conv{background:color-mix(in srgb,var(--danger) 12%,transparent)}

/* meses / convergências */
.mes{text-transform:capitalize;color:var(--muted);font-size:.9rem;font-weight:700;margin:22px 0 8px;letter-spacing:.02em}
.conv-card{background:var(--card);border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line));border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.conv-card header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.conv-card h3{margin:0;text-transform:capitalize}
.pill{display:inline-block;background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);font-weight:700;font-size:.78rem;border-radius:99px;padding:2px 10px}
.conv-card ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.conv-card li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:.92rem}
.link{border:0;background:none;color:var(--brand);padding:0;text-decoration:underline;font-size:.88rem}

/* botões e formulário */
.fab{position:fixed;right:16px;bottom:88px;z-index:25;border:0;background:var(--brand);color:var(--brand-ink);font-weight:700;border-radius:99px;padding:14px 20px;box-shadow:0 8px 24px rgba(79,70,229,.4);font-size:1rem}
@media(min-width:760px){.fab{bottom:24px;right:24px}}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.btn.danger{color:var(--danger)}
dialog{border:0;border-radius:20px;padding:0;background:var(--card);color:var(--text);width:min(520px,calc(100% - 24px));box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,25,.55)}
dialog form,dialog .inner{padding:20px;display:grid;gap:12px}
dialog h2{margin:0}
label.f{display:grid;gap:4px;font-size:.85rem;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;color:var(--text);font-weight:400;width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.hint{font-size:.82rem;color:var(--muted);margin:0}
.empty{text-align:center;padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);margin-top:16px}
.empty .big{font-size:2.4rem}
.empty .actions{justify-content:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:#1b1f2a;color:#fff;padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90%}
#toast.on{opacity:1}
/* filtros por tipo */
.filtros{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:.86rem}
.fchip:hover{border-color:var(--c,var(--brand))}
.fchip[aria-pressed=true]{background:color-mix(in srgb,var(--c,var(--brand)) 18%,var(--card));border-color:var(--c,var(--brand));font-weight:700}
/* disciplinas */
.discs{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:12px}
.disc{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:grid;gap:8px;width:100%;align-content:start}
.disc:hover{border-color:var(--brand)}
.disc h3{margin:0;font-size:1.05rem;overflow-wrap:anywhere}
.minis{display:flex;gap:6px;flex-wrap:wrap}
.mini{font-size:.76rem;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);padding:2px 9px;border-radius:99px}
/* dias seguidos */
.conv-card.seq{border-color:color-mix(in srgb,var(--f-talvez) 50%,var(--line))}
.pill.alt{color:var(--f-talvez);background:color-mix(in srgb,var(--f-talvez) 16%,transparent)}
.dl{min-width:8em;text-transform:capitalize}
.its{display:grid;gap:4px}
#btnNuvem .lbl{display:none}
@media(min-width:760px){#btnNuvem .lbl{display:inline;margin-left:6px;font-size:.85rem}}
#btnNuvem[data-st=erro]{border-color:var(--danger)}
#btnNuvem[data-st=ok]{border-color:var(--f-futuro)}
#nform{padding:0}
.msg-erro{color:var(--danger);font-size:.88rem;margin:0;min-height:1.2em}
.kv{display:grid;gap:2px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem}
.kv span{color:var(--muted);font-size:.8rem}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="bar">
  <h1 id="titulo">Meu Painel Acadêmico<small id="hoje"></small></h1>
  <div class="tools">
    <button class="icon-btn" id="btnNuvem" data-a="nuvem" data-st="local" hidden aria-label="Sincronização na nuvem"></button>
    <button class="icon-btn" data-a="tema" title="Alternar tema claro/escuro" aria-label="Alternar tema claro ou escuro">🌓</button>
    <button class="icon-btn" data-a="backup" title="Backup e dados" aria-label="Backup e dados">💾</button>
  </div>
</div></div></header>

<nav class="tabs" id="nav" aria-label="Seções"></nav>
<main class="wrap" id="view"></main>
<noscript><p class="wrap">Este site precisa de JavaScript ativado para funcionar.</p></noscript>

<footer class="wrap" style="text-align:center;color:var(--muted);font-size:.75rem;padding:24px 16px 8px">Painel Acadêmico · versão 1.2</footer>
<button class="fab" data-a="add" aria-label="Adicionar atividade">＋ Nova</button>

<dialog id="dlg">
<form id="form" autocomplete="off">
  <h2 id="dlgTitle">Nova atividade</h2>
  <label class="f">Tipo
    <select name="tipo">
      <option value="prova">📝 Prova</option>
      <option value="seminario">🎤 Seminário</option>
      <option value="trabalho">📄 Trabalho / atividade</option>
      <option value="ic">🔬 Iniciação Científica</option>
      <option value="reposicao">🔁 Dia de reposição</option>
      <option value="outro">📌 Outro</option>
    </select>
  </label>
  <label class="f">Título
    <input name="titulo" required maxlength="120" placeholder="Ex.: Prova de Cálculo II">
  </label>
  <label class="f">Disciplina / projeto (opcional)
    <input name="disciplina" maxlength="80" list="dl-disc" placeholder="Ex.: Cálculo II">
    <datalist id="dl-disc"></datalist>
  </label>
  <div class="row">
    <label class="f">Data<input type="date" name="data" required></label>
    <label class="f">Hora (opcional)<input type="time" name="hora"></label>
  </div>
  <label class="f">Anotações (opcional)
    <textarea name="notas" rows="3" maxlength="500" placeholder="Conteúdo, sala, link, o que levar…"></textarea>
  </label>
  <p class="hint">Sem hora definida, o prazo vale até o fim do dia (23:59).</p>
  <div class="actions">
    <button type="button" class="btn" data-a="cancel">Cancelar</button>
    <button type="submit" class="btn primary">Salvar</button>
  </div>
</form>
</dialog>

<dialog id="bdlg">
<div class="inner">
  <h2>Backup e dados</h2>
  <p class="hint">Seus dados ficam salvos neste navegador (e na nuvem, se você entrou na sua conta ☁️). Mesmo assim, baixe um backup de vez em quando por segurança.</p>
  <div class="actions" style="justify-content:flex-start">
    <button class="btn primary" data-a="export">⬇ Baixar backup</button>
    <button class="btn" data-a="import">⬆ Restaurar backup</button>
  </div>
  <div class="actions" style="justify-content:flex-start">
    <button class="btn" data-a="exemplos">✨ Carregar exemplos</button>
    <button class="btn danger" data-a="limpar">🗑 Apagar tudo</button>
  </div>
  <div class="actions"><button class="btn" data-a="fechar-backup">Fechar</button></div>
</div>
</dialog>
<dialog id="ndlg"><div class="inner" id="ncont"></div></dialog>
<input type="file" id="file" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(()=>{
'use strict';

/* ===== CONFIGURAÇÕES (pode mexer aqui) ===== */
const CONFIG={
  TITULO:'Meu Painel Acadêmico',
  FAIXA_AGORA_DIAS:6,     // "Fazer agora!": de agora até 6 dias
  FAIXA_TALVEZ_DIAS:11,   // "Pode procrastinar mais": de 6 até 11 dias; acima disso é "Problema do futuro"
  HORA_PADRAO:'23:59',    // hora considerada quando a atividade não tem horário
  // Sincronização na nuvem (Supabase). Deixe vazio para usar só neste aparelho.
  SUPABASE_URL:'https://sewxiowvooltnghktymc.supabase.co',        // ex.: 'https://abcdefgh.supabase.co'
  SUPABASE_KEY:'sb_publishable_E8PZOmnq6wgXQNVXF210XA_WKoCfCy7'         // chave "publishable" (sb_publishable_...) ou "anon" — NUNCA use a "secret"
};

const KEY='painel-academico-v1';
const DAY=864e5;
const TIPOS={
  prova:{nome:'Prova',cor:'--c-prova',ic:'📝'},
  seminario:{nome:'Seminário',cor:'--c-seminario',ic:'🎤'},
  trabalho:{nome:'Trabalho',cor:'--c-trabalho',ic:'📄'},
  ic:{nome:'Iniciação Científica',cor:'--c-ic',ic:'🔬'},
  outro:{nome:'Outro',cor:'--c-outro',ic:'📌'},
  reposicao:{nome:'Reposição',cor:'--c-reposicao',ic:'🔁'}
};
const TABS=[
  ['prazos','📅','Prazos','Prazos'],
  ['prioridades','🔥','Prioridades','Prioridades'],
  ['calendario','🗓️','Calendário','Calendário'],
  ['disciplinas','📚','Disciplinas','Disciplinas'],
  ['provas','📝','Provas','Provas e seminários'],
  ['convergencias','⚠️','Conflitos','Dias de convergência']
];

const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fromIso=(s,h)=>{const [y,m,d]=s.split('-').map(Number);const [hh,mm]=(h||CONFIG.HORA_PADRAO).split(':').map(Number);return new Date(y,m-1,d,hh,mm)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const cmp=(a,b)=>fromIso(a.data,a.hora)-fromIso(b.data,b.hora)||a.titulo.localeCompare(b.titulo);
const plural=(n,s,p)=>`${n} ${n===1?s:p}`;
const fmtDia=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric',month:'short'})};
const fmtDiaLongo=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})};
const ehPS=i=>i.tipo==='prova'||i.tipo==='seminario';

function load(){
  try{const a=JSON.parse(localStorage.getItem(KEY));return Array.isArray(a)?a.map(normalizar).filter(Boolean):[]}catch{return []}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch{toast('Não foi possível salvar neste navegador.')}}
function refresh(){items=store.filter(x=>!x.excluido)}
function commit(){save();refresh();agendarSync()}
function substituirTudo(lista){
  const agora=Date.now(),ids=new Set(lista.map(x=>x.id));
  for(const s of store)if(!ids.has(s.id)&&!s.excluido){s.excluido=true;s.ts=agora}
  for(const n of lista){
    n.ts=agora;n.excluido=false;
    const i=store.findIndex(x=>x.id===n.id);
    if(i>=0)store[i]=n;else store.push(n);
  }
  commit();
}
function normalizar(o){
  if(!o||typeof o!=='object')return null;
  const tipo=TIPOS[o.tipo]?o.tipo:'outro';
  const titulo=String(o.titulo||'').trim().slice(0,120);
  const data=/^\d{4}-\d{2}-\d{2}$/.test(o.data||'')?o.data:'';
  if(!titulo||!data)return null;
  return {id:String(o.id||uid()),tipo,titulo,disciplina:String(o.disciplina||'').slice(0,80),data,
    hora:/^\d{2}:\d{2}$/.test(o.hora||'')?o.hora:'',notas:String(o.notas||'').slice(0,500),feito:!!o.feito,
    excluido:!!o.excluido,ts:Number(o.ts)||0};
}

let store=load();            // todas as atividades (inclui as excluídas, para sincronizar a exclusão)
let items=store.filter(x=>!x.excluido);   // só as visíveis
const hoje0=new Date();
const ui={cal:{y:hoje0.getFullYear(),m:hoje0.getMonth()},sel:iso(hoje0),verFeitas:false,filtro:'todos',passadas:false,fpri:new Set(),disc:null};

/* ===== regras de negócio ===== */
function faixa(it,now){
  const t=fromIso(it.data,it.hora)-now;
  if(t<CONFIG.FAIXA_AGORA_DIAS*DAY)return 'agora';
  if(t<CONFIG.FAIXA_TALVEZ_DIAS*DAY)return 'talvez';
  return 'futuro';
}
function restante(it,now){
  const t=fromIso(it.data,it.hora)-now;
  if(t<0){const d=Math.floor(-t/DAY);return {txt:d>=1?`atrasada há ${plural(d,'dia','dias')}`:'atrasada',cls:'late'}}
  const d=Math.floor(t/DAY),h=Math.floor((t%DAY)/36e5);
  if(d>=1)return {txt:`faltam ${plural(d,'dia','dias')}${d<3&&h?` e ${h}h`:''}`,cls:d<=1?'soon':''};
  if(h>=1)return {txt:`faltam ${h}h`,cls:'soon'};
  return {txt:'falta menos de 1h',cls:'soon'};
}
function diasAte(k){
  const n=Math.round((fromIso(k,'00:00')-fromIso(iso(new Date()),'00:00'))/DAY);
  return n===0?'hoje':n===1?'amanhã':n===-1?'ontem':n<0?`há ${-n} dias`:`em ${n} dias`;
}
function convergencias(){
  const m=new Map();
  for(const it of items){if(!ehPS(it))continue;if(!m.has(it.data))m.set(it.data,[]);m.get(it.data).push(it)}
  const out=new Map();
  for(const [d,arr] of m){
    const p=arr.filter(x=>x.tipo==='prova').length,s=arr.length-p;
    if(p>=2||s>=2||(p&&s)){
      const partes=[];
      if(p)partes.push(plural(p,'prova','provas'));
      if(s)partes.push(plural(s,'seminário','seminários'));
      out.set(d,{p,s,arr:arr.sort(cmp),label:partes.join(' + '),kind:p&&s?'Prova e seminário no mesmo dia':p>1?'Mais de uma prova no dia':'Mais de um seminário no dia'});
    }
  }
  return out;
}

/* ===== componentes ===== */
function card(it,now,conv){
  const T=TIPOS[it.tipo];
  const rep=it.tipo==='reposicao';
  const r=rep?null:restante(it,now);
  const warn=ehPS(it)&&conv.has(it.data);
  return `<article class="card ${it.feito?'done':''}" style="--c:var(${T.cor})" data-id="${it.id}">
  <div class="card-top"><span class="tag">${T.ic} ${T.nome}</span>${warn?'<span class="warn">⚠ dia de convergência</span>':''}</div>
  <h3>${esc(it.titulo)}</h3>
  <p class="meta">${it.disciplina?esc(it.disciplina)+' · ':''}${fmtDia(it.data)}${it.hora?' às '+it.hora:''}</p>
  ${it.notas?`<p class="notes">${esc(it.notas)}</p>`:''}
  <div class="card-bot"><span class="count ${r&&!it.feito?r.cls:''}">${it.feito?'✔ concluída':rep?'':r.txt}</span>
  <span class="acts">
    ${rep?'':`<button data-a="toggle" title="${it.feito?'Reabrir':'Marcar como concluída'}" aria-label="${it.feito?'Reabrir':'Marcar como concluída'}">${it.feito?'↩️':'✅'}</button>`}
    <button data-a="edit" title="Editar" aria-label="Editar">✏️</button>
    <button data-a="del" title="Excluir" aria-label="Excluir">🗑️</button>
  </span></div></article>`;
}
const vazioNovo=()=>`<div class="empty"><div class="big">🎓</div><h2>Tudo limpo por aqui</h2>
<p class="hint">Adicione sua primeira atividade ou carregue exemplos para conhecer o painel.</p>
<div class="actions"><button class="btn primary" data-a="add">＋ Adicionar atividade</button><button class="btn" data-a="exemplos">✨ Carregar exemplos</button></div></div>`;

/* ===== telas ===== */
function viewPrazos(now,conv){
  if(!items.length)return vazioNovo();
  const base=items.filter(i=>i.tipo!=='reposicao');
  const pend=base.filter(i=>!i.feito);
  const vis=base.filter(i=>ui.verFeitas||!i.feito).sort(cmp);
  const atrasadas=vis.filter(i=>!i.feito&&fromIso(i.data,i.hora)<now);
  const resto=vis.filter(i=>!atrasadas.includes(i));
  const nAgora=pend.filter(i=>faixa(i,now)==='agora'&&fromIso(i.data,i.hora)>=now).length;
  const nConv=[...conv.keys()].filter(k=>k>=iso(now)).length;
  const prox=pend.filter(i=>ehPS(i)&&fromIso(i.data,i.hora)>=now).sort(cmp)[0];
  return `<div class="stats">
    <div class="stat"><b>${nAgora}</b><span>para fazer agora</span></div>
    <div class="stat ${atrasadas.length?'bad':''}"><b>${atrasadas.length}</b><span>atrasada${atrasadas.length===1?'':'s'}</span></div>
    <div class="stat"><b>${nConv}</b><span>dia${nConv===1?'':'s'} de convergência</span></div>
    <div class="stat wide">${prox?`<span>Próxima prova ou seminário</span><b>${TIPOS[prox.tipo].ic} ${esc(prox.titulo)} — ${diasAte(prox.data)}</b>`:'<span>Nenhuma prova ou seminário à vista 🎉</span>'}</div>
  </div>
  <div class="opts"><label><input type="checkbox" data-k="verFeitas" ${ui.verFeitas?'checked':''}> Mostrar concluídas</label></div>
  ${atrasadas.length?`<h2 style="color:var(--danger)">⏰ Atrasadas</h2><div class="grid">${atrasadas.map(i=>card(i,now,conv)).join('')}</div>`:''}
  <h2>Próximos prazos</h2>
  ${resto.length?`<div class="grid">${resto.map(i=>card(i,now,conv)).join('')}</div>`:'<p class="vazio">Nada pendente. Aproveite! 😌</p>'}`;
}

const FILTROS=[['prova','📝 Provas'],['seminario','🎤 Seminários'],['trabalho','📄 Trabalhos'],['ic','🔬 IC'],['outro','📌 Outros']];
function filtrosPri(){
  return `<div class="filtros" role="group" aria-label="Filtrar por tipo de atividade">
    <button class="fchip" data-a="fpri" data-v="todos" aria-pressed="${!ui.fpri.size}">Todos</button>
    ${FILTROS.map(([v,t])=>`<button class="fchip" style="--c:var(${TIPOS[v].cor})" data-a="fpri" data-v="${v}" aria-pressed="${ui.fpri.has(v)}">${t}</button>`).join('')}</div>`;
}
function viewPrioridades(now,conv){
  if(!items.length)return vazioNovo();
  const pend=items.filter(i=>i.tipo!=='reposicao'&&!i.feito&&(!ui.fpri.size||ui.fpri.has(i.tipo))).sort(cmp);
  const A=CONFIG.FAIXA_AGORA_DIAS,B=CONFIG.FAIXA_TALVEZ_DIAS;
  const defs=[
    ['agora','🔥','Fazer agora!',`até ${A} dias (inclui atrasadas)`],
    ['talvez','😎','Pode procrastinar mais',`de ${A} a ${B} dias`],
    ['futuro','🔭','Problema do futuro',`${B} dias ou mais`]
  ];
  return `<h2 style="margin-top:16px">Prioridades por urgência</h2><p class="hint">A divisão é automática: muda sozinha conforme os dias passam. Toque nos filtros para ver só alguns tipos (dá para combinar).</p>${filtrosPri()}
  <div class="cols" style="margin-top:12px">${defs.map(([k,ic,t,sub])=>{
    const l=pend.filter(i=>faixa(i,now)===k);
    return `<section class="col" style="--f:var(--f-${k})"><header><h2>${ic} ${t} <span aria-label="${l.length} itens">(${l.length})</span></h2><p>${sub}</p></header>
    <div class="stack">${l.length?l.map(i=>card(i,now,conv)).join(''):'<p class="vazio">Nada por aqui</p>'}</div></section>`}).join('')}</div>`;
}

function viewCalendario(now,conv){
  const {y,m}=ui.cal;
  const first=new Date(y,m,1),total=new Date(y,m+1,0).getDate();
  const semanas=Math.ceil((first.getDay()+total)/7);
  const porDia=new Map();
  for(const it of items){if(!porDia.has(it.data))porDia.set(it.data,[]);porDia.get(it.data).push(it)}
  const hojeK=iso(now);
  let cel='';
  for(let i=0;i<semanas*7;i++){
    const d=new Date(y,m,1-first.getDay()+i),k=iso(d);
    const l=(porDia.get(k)||[]).sort(cmp);
    const rep=l.some(x=>x.tipo==='reposicao'),cv=conv.has(k);
    const normais=l.filter(x=>x.tipo!=='reposicao');
    const chips=normais.slice(0,3).map(x=>`<span class="chip ${x.feito?'done':''}" style="--c:var(${TIPOS[x.tipo].cor})"><i></i><b>${esc(x.titulo)}</b></span>`).join('');
    const mais=normais.length>3?`<span class="more">+${normais.length-3}</span>`:'';
    const desc=`${fmtDiaLongo(k)}${normais.length?`, ${plural(normais.length,'atividade','atividades')}`:''}${rep?', dia de reposição':''}${cv?', dia de convergência':''}`;
    cel+=`<button class="day ${d.getMonth()!==m?'out':''} ${k===hojeK?'today':''} ${k===ui.sel?'sel':''} ${rep?'rep':''} ${cv?'conv':''}" data-a="day" data-d="${k}" aria-label="${esc(desc)}">
      <span class="n">${d.getDate()}</span><span class="flags">${rep?'🔁':''}${cv?'⚠️':''}</span><span class="chips">${chips}${mais}</span></button>`;
  }
  const sel=(porDia.get(ui.sel)||[]).sort(cmp);
  const selRep=sel.filter(x=>x.tipo==='reposicao'),selOut=sel.filter(x=>x.tipo!=='reposicao');
  const c=conv.get(ui.sel);
  const titulo=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  return `<div class="cal-head"><button class="icon-btn" data-a="prev" aria-label="Mês anterior">◀</button>
    <h2>${titulo}</h2>
    <span style="display:flex;gap:6px"><button class="icon-btn" data-a="hoje">Hoje</button><button class="icon-btn" data-a="next" aria-label="Próximo mês">▶</button></span></div>
  <div class="cal" role="group" aria-label="Calendário de ${titulo}">${['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="dow">${d}</div>`).join('')}${cel}</div>
  <div class="legend">${['prova','seminario','trabalho','ic','outro'].map(k=>`<span style="--c:var(${TIPOS[k].cor})"><i></i>${TIPOS[k].nome}</span>`).join('')}
    <span><i class="stripe" style="border-radius:3px"></i>🔁 Reposição</span><span>⚠️ Convergência</span></div>
  <section class="panel" aria-live="polite"><h3>${fmtDiaLongo(ui.sel)}</h3>
    ${selRep.map(x=>`<div class="note rep">🔁 <b>${esc(x.titulo)}</b>${x.disciplina?' · '+esc(x.disciplina):''}${x.hora?' às '+x.hora:''} <button class="link" data-id="${x.id}" data-a="edit">editar</button> <button class="link" data-id="${x.id}" data-a="del">excluir</button></div>`).join('')}
    ${c?`<div class="note conv">⚠️ <b>Dia de convergência:</b> ${c.label}.</div>`:''}
    <div class="stack">${selOut.length?selOut.map(x=>card(x,now,conv)).join(''):'<p class="hint">Nenhuma atividade neste dia.</p>'}</div>
    <div class="actions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary" data-a="add" data-d="${ui.sel}">＋ Adicionar neste dia</button></div>
  </section>`;
}

/* ----- Disciplinas ----- */
const chaveDisc=s=>String(s||'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function nomesDisc(){
  const m=new Map();
  for(const it of items){const k=chaveDisc(it.disciplina);if(k&&!m.has(k))m.set(k,it.disciplina.trim())}
  return [...m.values()].sort((a,b)=>a.localeCompare(b,'pt-BR'));
}
function disciplinasMapa(){
  const m=new Map();
  for(const it of items){
    const k=chaveDisc(it.disciplina);
    if(!k&&it.tipo==='reposicao')continue;
    if(!m.has(k))m.set(k,{k,nome:k?it.disciplina.trim():'Sem disciplina',itens:[]});
    m.get(k).itens.push(it);
  }
  return m;
}
function viewDisciplinas(now,conv){
  if(!items.length)return vazioNovo();
  const m=disciplinasMapa();
  if(ui.disc!==null&&m.has(ui.disc))return detalheDisc(m.get(ui.disc),now,conv);
  ui.disc=null;
  const lista=[...m.values()].map(d=>{
    const pend=d.itens.filter(i=>i.tipo!=='reposicao'&&!i.feito).sort(cmp);
    return {...d,pend,feitas:d.itens.filter(i=>i.tipo!=='reposicao'&&i.feito).length,prox:pend[0]};
  }).sort((a,b)=>(a.prox?0:1)-(b.prox?0:1)||(a.prox&&b.prox?cmp(a.prox,b.prox):0)||a.nome.localeCompare(b.nome,'pt-BR'));
  return `<h2 style="margin-top:16px">Disciplinas e projetos</h2>
  <p class="hint">Toque em uma disciplina para ver todas as demandas dela. Ordenadas pela próxima entrega. O nome vem do campo "Disciplina / projeto" de cada atividade.</p>
  <div class="discs">${lista.map(d=>{
    const minis=['prova','seminario','trabalho','ic','outro'].map(t=>{const n=d.pend.filter(i=>i.tipo===t).length;return n?`<span class="mini" style="--c:var(${TIPOS[t].cor})">${TIPOS[t].ic} ${n}</span>`:''}).join('');
    return `<button class="disc" data-a="disc" data-k="${esc(d.k)}"><h3>📚 ${esc(d.nome)}</h3>
      <p class="meta">${plural(d.pend.length,'pendente','pendentes')} · ${plural(d.feitas,'concluída','concluídas')}</p>
      ${minis?`<div class="minis">${minis}</div>`:''}
      <span class="count ${d.prox&&fromIso(d.prox.data,d.prox.hora)<now?'late':''}">${d.prox?`Próxima: ${TIPOS[d.prox.tipo].ic} ${esc(d.prox.titulo)} — ${diasAte(d.prox.data)}`:'Nada pendente 🎉'}</span></button>`}).join('')}</div>`;
}
function detalheDisc(d,now,conv){
  const pend=d.itens.filter(i=>i.tipo!=='reposicao'&&!i.feito).sort(cmp);
  const feitas=d.itens.filter(i=>i.tipo!=='reposicao'&&i.feito).sort(cmp);
  const reps=d.itens.filter(i=>i.tipo==='reposicao').sort(cmp);
  const atras=pend.filter(i=>fromIso(i.data,i.hora)<now).length;
  const prox=pend.find(i=>ehPS(i)&&fromIso(i.data,i.hora)>=now);
  const sec=(t,l,vz)=>l.length?`<h2>${t} (${l.length})</h2><div class="grid">${l.map(i=>card(i,now,conv)).join('')}</div>`:(vz?`<h2>${t}</h2><p class="vazio">${vz}</p>`:'');
  return `<p style="margin:14px 0 0"><button class="link" data-a="disc-voltar">← Todas as disciplinas</button></p>
  <h2 style="margin-top:8px">📚 ${esc(d.nome)}</h2>
  <div class="stats">
    <div class="stat"><b>${pend.length}</b><span>pendente${pend.length===1?'':'s'}</span></div>
    <div class="stat ${atras?'bad':''}"><b>${atras}</b><span>atrasada${atras===1?'':'s'}</span></div>
    <div class="stat"><b>${feitas.length}</b><span>concluída${feitas.length===1?'':'s'}</span></div>
    <div class="stat wide">${prox?`<span>Próxima prova ou seminário</span><b>${TIPOS[prox.tipo].ic} ${esc(prox.titulo)} — ${diasAte(prox.data)}</b>`:'<span>Nenhuma prova ou seminário à vista nesta disciplina</span>'}</div>
  </div>
  <div class="actions" style="justify-content:flex-start;margin:12px 0 0"><button class="btn primary" data-a="add" data-disc="${esc(d.k?d.nome:'')}">＋ Adicionar nesta disciplina</button></div>
  ${sec('Pendentes',pend,'Nada pendente aqui. 😌')}${sec('Dias de reposição',reps)}${sec('Concluídas',feitas)}`;
}

/* ----- Dias seguidos (provas e/ou seminários em dias consecutivos) ----- */
function sequencias(){
  const porDia=new Map();
  for(const it of items){if(!ehPS(it))continue;if(!porDia.has(it.data))porDia.set(it.data,[]);porDia.get(it.data).push(it)}
  const dias=[...porDia.keys()].sort();
  const seguido=(a,b)=>Math.round((fromIso(b,'00:00')-fromIso(a,'00:00'))/DAY)===1;
  const grupos=[];let cur=[];
  for(const d of dias){
    if(cur.length&&seguido(cur[cur.length-1],d))cur.push(d);
    else{if(cur.length>1)grupos.push(cur);cur=[d]}
  }
  if(cur.length>1)grupos.push(cur);
  return grupos.map(ds=>{
    const arr=ds.flatMap(d=>porDia.get(d));
    const p=arr.filter(x=>x.tipo==='prova').length,s=arr.length-p;
    const partes=[];
    if(p)partes.push(plural(p,'prova','provas'));
    if(s)partes.push(plural(s,'seminário','seminários'));
    return {dias:ds,mapa:porDia,label:partes.join(' + ')};
  });
}
function seqCard(s,conv){
  const ini=s.dias[0],fim=s.dias[s.dias.length-1];
  return `<article class="conv-card seq"><header>
    <div><h3>${fmtDia(ini)} → ${fmtDia(fim)}</h3><span class="hint">${plural(s.dias.length,'dia seguido','dias seguidos')} · começa ${diasAte(ini)}</span></div>
    <span class="pill alt">🔗 ${s.label}</span></header>
    <ul>${s.dias.map(d=>`<li><b class="dl">${fmtDia(d)}</b><span class="its">${s.mapa.get(d).sort(cmp).map(i=>`<span><span class="tag" style="--c:var(${TIPOS[i.tipo].cor})">${TIPOS[i.tipo].ic} ${TIPOS[i.tipo].nome}</span> <b>${esc(i.titulo)}</b>${i.disciplina?` <span class="hint">· ${esc(i.disciplina)}</span>`:''}${i.hora?` <span class="hint">às ${i.hora}</span>`:''}</span>`).join('')}</span></li>`).join('')}</ul>
    ${s.dias.some(d=>conv.has(d))?'<p class="hint" style="margin:8px 0 0">⚠ Esta sequência inclui dia(s) de convergência.</p>':''}
    <p style="margin:10px 0 0"><button class="link" data-a="ver-cal" data-d="${ini}">Ver no calendário →</button></p></article>`;
}

function viewProvas(now,conv){
  if(!items.length)return vazioNovo();
  const hojeK=iso(now);
  let l=items.filter(ehPS).sort(cmp);
  if(ui.filtro!=='todos')l=l.filter(i=>i.tipo===ui.filtro);
  if(!ui.passadas)l=l.filter(i=>i.data>=hojeK);
  let html='',mes='';
  for(const it of l){
    const [y,m]=it.data.split('-').map(Number);
    const nome=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
    if(nome!==mes){if(mes)html+='</div>';mes=nome;html+=`<div class="mes">${nome}</div><div class="grid">`}
    html+=card(it,now,conv);
  }
  if(mes)html+='</div>';
  const seg=[['todos','Todos'],['prova','Provas'],['seminario','Seminários']];
  return `<h2 style="margin-top:16px">Provas e seminários em ordem cronológica</h2>
  <div class="opts"><span class="seg" role="group" aria-label="Filtro">${seg.map(([v,t])=>`<button data-a="filtro" data-v="${v}" aria-pressed="${ui.filtro===v}">${t}</button>`).join('')}</span>
  <label><input type="checkbox" data-k="passadas" ${ui.passadas?'checked':''}> Mostrar já passadas</label></div>
  ${html||'<p class="vazio">Nenhuma prova ou seminário para mostrar.</p>'}`;
}

function viewConv(now,conv){
  if(!items.length)return vazioNovo();
  const hojeK=iso(now);
  const seqs=sequencias().filter(s=>s.dias[s.dias.length-1]>=hojeK);
  const lista=[...conv.entries()].filter(([k])=>k>=hojeK).sort((a,b)=>a[0].localeCompare(b[0]));
  return `<h2 style="margin-top:16px">Dias de convergência</h2>
  <p class="hint">Dias com mais de uma prova, mais de um seminário, ou prova e seminário juntos. Bom para planejar os estudos com antecedência.</p>
  <div style="margin-top:14px">${lista.length?lista.map(([k,c])=>`<article class="conv-card"><header>
    <div><h3>${fmtDiaLongo(k)}</h3><span class="hint">${diasAte(k)}</span></div><span class="pill">⚠ ${c.label}</span></header>
    <p class="hint" style="margin-top:6px">${c.kind}</p>
    <ul>${c.arr.map(i=>`<li><span class="tag" style="--c:var(${TIPOS[i.tipo].cor})">${TIPOS[i.tipo].ic} ${TIPOS[i.tipo].nome}</span><b>${esc(i.titulo)}</b>${i.disciplina?`<span class="hint">${esc(i.disciplina)}</span>`:''}${i.hora?`<span class="hint">às ${i.hora}</span>`:''}</li>`).join('')}</ul>
    <p style="margin:10px 0 0"><button class="link" data-a="ver-cal" data-d="${k}">Ver no calendário →</button></p></article>`).join('')
    :'<p class="vazio">Nenhum dia de convergência pela frente 🎉</p>'}</div>
  <h2 style="margin-top:28px">Dias seguidos com provas e seminários</h2>
  <p class="hint">Dois ou mais dias consecutivos com pelo menos uma prova ou seminário. Mesmo sem conflito no mesmo dia, uma sequência exige preparo adiantado.</p>
  <div style="margin-top:14px">${seqs.length?seqs.map(s=>seqCard(s,conv)).join(''):'<p class="vazio">Nenhuma sequência de dias seguidos pela frente 🎉</p>'}</div>`;
}

/* ===== renderização ===== */
const VIEWS={prazos:viewPrazos,prioridades:viewPrioridades,calendario:viewCalendario,disciplinas:viewDisciplinas,provas:viewProvas,convergencias:viewConv};
function tabAtual(){const h=location.hash.slice(1);return VIEWS[h]?h:'prazos'}
function render(){
  const now=new Date(),conv=convergencias(),tab=tabAtual();
  $('#hoje').textContent=now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const pend=items.filter(i=>i.tipo!=='reposicao'&&!i.feito);
  const nAgora=pend.filter(i=>faixa(i,now)==='agora').length;
  const nConv=[...conv.keys()].filter(k=>k>=iso(now)).length;
  const nSeq=sequencias().filter(s=>s.dias[s.dias.length-1]>=iso(now)).length;
  const badges={prioridades:nAgora,convergencias:nConv+nSeq};
  $('#nav').innerHTML=TABS.map(([id,ic,curto,longo])=>`<a href="#${id}" ${id===tab?'aria-current="page"':''} title="${longo}"><span class="ic" aria-hidden="true">${ic}</span><span class="short">${curto}</span><span class="long">${longo}</span>${badges[id]?`<span class="badge" aria-label="${badges[id]}">${badges[id]}</span>`:''}</a>`).join('');
  $('#view').innerHTML=VIEWS[tab](now,conv);
}

/* ===== interações ===== */
const dlg=$('#dlg'),form=$('#form'),bdlg=$('#bdlg'),file=$('#file');
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.id);toast.id=setTimeout(()=>t.classList.remove('on'),2600)}
function openForm(id,dataPre,discPre){
  const it=id?items.find(x=>x.id===id):null;
  form.reset();form.dataset.id=it?it.id:'';
  $('#dlgTitle').textContent=it?'Editar atividade':'Nova atividade';
  form.tipo.value=it?it.tipo:(tabAtual()==='provas'?'prova':'trabalho');
  form.titulo.value=it?it.titulo:'';
  form.disciplina.value=it?it.disciplina:(discPre||'');
  $('#dl-disc').innerHTML=nomesDisc().map(n=>`<option value="${esc(n)}">`).join('');
  form.data.value=it?it.data:(dataPre||iso(new Date()));
  form.hora.value=it?it.hora:'';
  form.notas.value=it?it.notas:'';
  dlg.showModal();form.titulo.focus();
}
function addDias(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function exemplos(){
  const ex=[
    ['prova','Prova de Cálculo II','Cálculo II',3,'08:00','Capítulos 4 a 6'],
    ['seminario','Seminário de Metodologia','Metodologia Científica',3,'14:00','Grupo de 4 pessoas'],
    ['trabalho','Lista de exercícios de Física','Física Geral',5,'','Entregar pelo portal'],
    ['reposicao','Reposição de aula de Física','Física Geral',6,'19:00',''],
    ['ic','Relatório parcial da IC','Iniciação Científica',8,'','Enviar ao orientador'],
    ['prova','Prova de Estatística','Estatística',10,'10:00',''],
    ['seminario','Seminário de Genética','Genética',14,'09:00',''],
    ['prova','Prova de Química Orgânica','Química Orgânica',14,'14:00','Mesmo dia do seminário!'],
    ['trabalho','Artigo final','Redação Científica',22,'','']
  ];
  for(const [tipo,titulo,disciplina,d,hora,notas] of ex)store.push({id:uid(),tipo,titulo,disciplina,data:addDias(d),hora,notas,feito:false,excluido:false,ts:Date.now()});
  commit();render();
}
function go(tab){if(location.hash.slice(1)===tab)render();else location.hash=tab;scrollTo(0,0)}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t)return;
  const a=t.dataset.a,id=t.closest('[data-id]')?.dataset.id;
  switch(a){
    case 'add':openForm(null,t.dataset.d,t.dataset.disc);break;
    case 'edit':openForm(id);break;
    case 'del':{const it=store.find(x=>x.id===id);if(it&&confirm(`Excluir "${it.titulo}"?`)){it.excluido=true;it.ts=Date.now();commit();render();toast('Excluída.')}break}
    case 'toggle':{const it=store.find(x=>x.id===id);if(it){it.feito=!it.feito;it.ts=Date.now();commit();render();toast(it.feito?'Concluída! 🎉':'Reaberta.')}break}
    case 'cancel':dlg.close();break;
    case 'day':ui.sel=t.dataset.d;render();break;
    case 'prev':case 'next':{ui.cal.m+=a==='next'?1:-1;if(ui.cal.m>11){ui.cal.m=0;ui.cal.y++}if(ui.cal.m<0){ui.cal.m=11;ui.cal.y--}render();break}
    case 'hoje':{const n=new Date();ui.cal={y:n.getFullYear(),m:n.getMonth()};ui.sel=iso(n);render();break}
    case 'filtro':ui.filtro=t.dataset.v;render();break;
    case 'fpri':{const v=t.dataset.v;if(v==='todos')ui.fpri.clear();else if(ui.fpri.has(v))ui.fpri.delete(v);else ui.fpri.add(v);render();break}
    case 'disc':ui.disc=t.dataset.k;render();scrollTo(0,0);break;
    case 'disc-voltar':ui.disc=null;render();scrollTo(0,0);break;
    case 'ver-cal':{const [y,m]=t.dataset.d.split('-').map(Number);ui.cal={y,m:m-1};ui.sel=t.dataset.d;go('calendario');break}
    case 'tema':{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem(KEY+'-tema',n)}catch{}break}
    case 'backup':bdlg.showModal();break;
    case 'fechar-backup':bdlg.close();break;
    case 'exemplos':bdlg.close();exemplos();toast('Exemplos carregados.');break;
    case 'limpar':if(confirm('Apagar TODAS as atividades? Isso não pode ser desfeito (a menos que você tenha um backup).')){substituirTudo([]);bdlg.close();render();toast('Tudo apagado.')}break;
    case 'nuvem':renderNuvem();ndlg.showModal();break;
    case 'fechar-nuvem':ndlg.close();break;
    case 'sync-agora':sincronizar();break;
    case 'sair':if(SB.c)SB.c.auth.signOut();break;
    case 'export':{
      const blob=new Blob([JSON.stringify({versao:1,itens:items},null,2)],{type:'application/json'});
      const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download=`painel-academico-${iso(new Date())}.json`;
      document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(l.href),1500);toast('Backup baixado.');break}
    case 'import':file.click();break;
  }
});
document.addEventListener('change',e=>{
  const k=e.target.dataset?.k;
  if(k){ui[k]=e.target.checked;render()}
});
file.addEventListener('change',()=>{
  const f=file.files[0];file.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      const lista=(Array.isArray(j)?j:j.itens||[]).map(normalizar).filter(Boolean);
      if(!lista.length){toast('Arquivo sem atividades válidas.');return}
      if(!confirm(`Restaurar ${lista.length} atividades? Isso substitui os dados atuais.`))return;
      substituirTudo(lista);bdlg.close();render();toast('Backup restaurado!');
    }catch{toast('Arquivo inválido.')}
  };
  r.readAsText(f);
});
form.addEventListener('submit',e=>{
  e.preventDefault();
  const f=new FormData(form);
  const o=normalizar({id:form.dataset.id||uid(),tipo:f.get('tipo'),titulo:f.get('titulo'),disciplina:f.get('disciplina'),data:f.get('data'),hora:f.get('hora'),notas:f.get('notas')});
  if(!o){toast('Preencha título e data.');return}
  const i=store.findIndex(x=>x.id===o.id);
  if(i>=0)o.feito=store[i].feito;
  o.excluido=false;o.ts=Date.now();
  if(i>=0)store[i]=o;else store.push(o);
  commit();dlg.close();ui.sel=o.data;
  const [y,m]=o.data.split('-').map(Number);ui.cal={y,m:m-1};
  render();toast('Salvo!');
});
const ndlg=$('#ndlg');
for(const d of [dlg,bdlg,ndlg])d.addEventListener('click',e=>{if(e.target===d)d.close()});
addEventListener('hashchange',render);
// iOS ignora user-scalable=no: bloqueia também os gestos de pinça
for(const g of ['gesturestart','gesturechange','gestureend'])document.addEventListener(g,e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();agendarSync()}});
addEventListener('online',()=>agendarSync());
addEventListener('offline',()=>{if(SB.user)setSt('offline')});

/* ===== NUVEM (Supabase) — sincronização entre aparelhos ===== */
// Estratégia: o aparelho sempre funciona sozinho (dados locais). Quando há conta logada,
// cada atividade é comparada pela data da última alteração (ts): a mais recente vence.
const SB={c:null,user:null,st:'local',msg:'',ultima:null,busy:false,again:false,timer:null,canal:null};
const nuvemAtiva=()=>!!(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_KEY);
const rowToItem=r=>({id:r.id,tipo:r.tipo,titulo:r.titulo,disciplina:r.disciplina,data:r.data,hora:r.hora,notas:r.notas,feito:r.feito,excluido:r.excluido,ts:Date.parse(r.atualizado_em)||0});
const itemToRow=i=>({user_id:SB.user.id,id:i.id,tipo:i.tipo,titulo:i.titulo,disciplina:i.disciplina,data:i.data,hora:i.hora,notas:i.notas,feito:i.feito,excluido:!!i.excluido,atualizado_em:new Date(i.ts||0).toISOString()});
function traduz(e){
  const m=String(e?.message||e||'');
  if(/Invalid login/i.test(m))return 'E-mail ou senha incorretos.';
  if(/Email not confirmed/i.test(m))return 'E-mail ainda não confirmado. No Supabase, marque "Auto Confirm User" ao criar o usuário.';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Sem conexão com o servidor (internet ou projeto pausado).';
  if(/row-level security|permission denied/i.test(m))return 'Permissão negada. Confira se o script SQL foi executado por completo.';
  if(/does not exist|schema cache|Could not find the table/i.test(m))return 'Tabela não encontrada. Execute o script SQL no Supabase.';
  return m.slice(0,160);
}
function setSt(st,msg=''){
  SB.st=st;SB.msg=msg;
  const b=$('#btnNuvem');b.dataset.st=st;
  const [ic,lb]=!SB.user&&st!=='sync'?['☁️','Entrar']:{sync:['🔄','Sincronizando'],ok:['✅','Sincronizado'],erro:['⚠️','Erro'],offline:['📴','Sem internet'],local:['☁️','Conectar']}[st]||['☁️','Nuvem'];
  b.innerHTML=`<span aria-hidden="true">${ic}</span><span class="lbl">${lb}</span>`;
  b.title=b.getAttribute('aria-label')+': '+lb;
  if(ndlg.open)renderNuvem();
}
function renderNuvem(){
  const hora=SB.ultima?SB.ultima.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'—';
  const txt={local:'Não conectado',sync:'Sincronizando…',ok:'Tudo sincronizado',erro:'Erro: '+SB.msg,offline:'Sem internet. As alterações ficam salvas aqui e sobem quando a conexão voltar.'}[SB.st]||'';
  $('#ncont').innerHTML=SB.user?`<h2>☁️ Sincronização</h2>
    <div class="kv"><span>Conta</span><b>${esc(SB.user.email)}</b></div>
    <div class="kv"><span>Situação</span><b>${esc(txt)}</b><span>Última sincronização: ${hora}</span></div>
    <p class="hint">Qualquer alteração aqui aparece nos seus outros aparelhos em instantes.</p>
    <div class="actions"><button class="btn" data-a="fechar-nuvem">Fechar</button><button class="btn danger" data-a="sair">Sair da conta</button><button class="btn primary" data-a="sync-agora">🔄 Sincronizar agora</button></div>`
  :`<h2>☁️ Sincronizar entre aparelhos</h2>
    <p class="hint">Entre com a conta que você criou no Supabase para ter os mesmos dados no celular e no computador.</p>
    <form id="nform"><label class="f">E-mail<input type="email" name="email" required autocomplete="email" inputmode="email"></label>
    <label class="f" style="margin-top:10px">Senha<input type="password" name="senha" required autocomplete="current-password"></label>
    <p class="msg-erro" id="nmsg" role="alert">${SB.st==='erro'?esc(SB.msg):''}</p>
    <div class="actions"><button type="button" class="btn" data-a="fechar-nuvem">Fechar</button><button type="submit" class="btn primary">Entrar</button></div></form>`;
}
async function sincronizar(){
  if(!SB.c||!SB.user)return;
  if(!navigator.onLine){setSt('offline');return}
  if(SB.busy){SB.again=true;return}
  SB.busy=true;setSt('sync');
  try{
    const {data,error}=await SB.c.from('atividades').select('*');
    if(error)throw error;
    const remoto=new Map();
    for(const r of data){const n=normalizar(rowToItem(r));if(n)remoto.set(n.id,n)}
    let mudou=false;
    for(const n of remoto.values()){
      const i=store.findIndex(x=>x.id===n.id);
      if(i<0){store.push(n);mudou=true}else if(n.ts>store[i].ts){store[i]=n;mudou=true}
    }
    const enviar=store.filter(l=>{const r=remoto.get(l.id);return !r||l.ts>r.ts}).map(itemToRow);
    if(enviar.length){
      const {error:e2}=await SB.c.from('atividades').upsert(enviar,{onConflict:'user_id,id'});
      if(e2)throw e2;
    }
    if(mudou){save();refresh();render()}
    SB.ultima=new Date();setSt('ok');
  }catch(e){setSt('erro',traduz(e))}
  finally{SB.busy=false;if(SB.again){SB.again=false;agendarSync()}}
}
function agendarSync(){
  if(!SB.user)return;
  clearTimeout(SB.timer);SB.timer=setTimeout(sincronizar,500);
}
function assinar(){
  if(SB.canal){SB.c.removeChannel(SB.canal);SB.canal=null}
  SB.canal=SB.c.channel('atividades-'+SB.user.id)
    .on('postgres_changes',{event:'*',schema:'public',table:'atividades'},()=>agendarSync())
    .subscribe();
}
function usuario(u){
  const antes=SB.user?.id;SB.user=u;
  if(u){
    let ant=null;try{ant=localStorage.getItem(KEY+'-uid')}catch{}
    if(ant&&ant!==u.id){store=[];save();refresh();render()}   // outra conta: não misturar dados
    try{localStorage.setItem(KEY+'-uid',u.id)}catch{}
    if(antes!==u.id)assinar();
    sincronizar();
  }else{
    if(SB.canal){SB.c.removeChannel(SB.canal);SB.canal=null}
    SB.ultima=null;setSt('local');
  }
}
async function iniciarNuvem(){
  if(!nuvemAtiva())return;
  $('#btnNuvem').hidden=false;setSt('local');
  try{
    const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    SB.c=createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_KEY);
    SB.c.auth.onAuthStateChange((ev,ses)=>{setTimeout(()=>usuario(ses?.user||null),0)});
  }catch{setSt('erro','Não foi possível carregar o serviço de nuvem (sem internet?). O painel continua funcionando neste aparelho.')}
}
document.addEventListener('submit',async e=>{
  if(e.target.id!=='nform')return;
  e.preventDefault();
  const msg=$('#nmsg'),f=new FormData(e.target),btn=e.target.querySelector('[type=submit]');
  if(!SB.c){msg.textContent='Serviço de nuvem indisponível agora. Tente de novo em instantes.';return}
  btn.disabled=true;msg.textContent='Entrando…';
  const {error}=await SB.c.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('senha'))});
  if(error){msg.textContent=traduz(error);btn.disabled=false}
  else{toast('Conectado! ☁️');ndlg.close()}
});

document.title=CONFIG.TITULO;$('#titulo').firstChild.textContent=CONFIG.TITULO;
render();
iniciarNuvem();
})();
</script>
